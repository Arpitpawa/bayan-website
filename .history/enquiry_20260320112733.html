<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enquiry | Bayan</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/enquiry.css">

<style>
/* BUTTONS */
.form-actions {
  display: flex;
  gap: 12px;
  margin-top: 25px;
}

.whatsapp-btn {
  flex: 1;
  background: #25D366;
  color: #fff;
  border: none;
  padding: 14px;
  font-size: 14px;
  cursor: pointer;
  font-weight: 500;
  transition: 0.3s;
}

.whatsapp-btn:hover {
  background: #1ebe5d;
}

.submit-btn {
  flex: 1;
  background: #b89b5e;
  color: white;
  border: none;
  padding: 14px;
  cursor: pointer;
}

/* POPUP */
.success-popup {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.popup-box {
  background: white;
  padding: 40px;
  text-align: center;
  max-width: 400px;
  animation: fadeIn 0.4s ease;
}

.popup-box h3 {
  font-family: 'Playfair Display', serif;
}

.popup-box button {
  margin-top: 20px;
  padding: 10px 20px;
  background: #b89b5e;
  border: none;
  color: white;
  cursor: pointer;
}

@keyframes fadeIn {
  from { transform: translateY(30px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
</style>

</head>

<body>

<!-- HERO -->
<section class="enquiry-hero">
  <h1>Plan Your Event With Bayan</h1>
  <p>Luxury venues across Rajasthan for weddings, corporate events & celebrations.</p>
</section>

<!-- MAIN -->
<section class="enquiry-section">

  <!-- IMAGE -->
  <div class="enquiry-image">
    <img src="assets/images/jaibagh-jaipur2.webp" alt="">
  </div>

  <!-- FORM -->
  <div class="enquiry-form">

    <h2>Event Enquiry</h2>

    <form id="enquiryForm"
          action="https://formsubmit.co/YOUR_EMAIL@gmail.com"
          method="POST">

      <!-- Hidden -->
      <input type="hidden" name="_subject" value="New Event Enquiry - Bayan">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">

      <div class="form-group">
        <label>Name</label>
        <input type="text" name="Name" required>
      </div>

      <div class="form-group">
        <label>Phone</label>
        <input type="tel" name="Phone" required>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" name="Email">
      </div>

      <div class="form-group">
        <label>Property</label>
        <input type="text" id="property" name="Property" readonly>
      </div>

      <div class="form-group">
        <label>Event Space</label>
        <input type="text" id="space" name="Event Space" readonly>
      </div>

      <div class="form-group">
        <label>Event Type</label>
        <select id="eventType" name="Event Type">
          <option>Wedding</option>
          <option>Corporate</option>
          <option>Private Party</option>
        </select>
      </div>

      <div class="form-group">
        <label>Guests</label>
        <input type="number" name="Guests">
      </div>

      <div class="form-group">
        <label>Event Date</label>
        <input type="date" name="Event Date">
      </div>

      <div class="form-group">
        <label>Message</label>
        <textarea name="Message"></textarea>
      </div>

      <!-- ACTION BUTTONS -->
      <div class="form-actions">

        <!-- WHATSAPP PRIMARY -->
        <button type="button" class="whatsapp-btn" onclick="sendWhatsApp()">
          ⚡ Get Instant Quote on WhatsApp
        </button>

        <!-- EMAIL SECONDARY -->
        <button type="submit" class="submit-btn">
          Submit Enquiry
        </button>

      </div>

    </form>

  </div>

</section>

<!-- POPUP -->
<div class="success-popup" id="successPopup">
  <div class="popup-box">
    <h3>Thank You</h3>
    <p>Your enquiry has been received.<br>Our team will contact you shortly.</p>
    <button onclick="closePopup()">Close</button>
  </div>
</div>

<!-- JS -->
<script>
const params = new URLSearchParams(window.location.search);

document.getElementById("property").value = params.get("property") || "";
document.getElementById("space").value = params.get("space") || "";

const type = params.get("type");
if(type){
  document.getElementById("eventType").value = type;
}

// WHATSAPP FUNCTION
function sendWhatsApp() {
  const form = document.getElementById("enquiryForm");
  const formData = new FormData(form);

  const message =
`New Enquiry:

Name: ${formData.get("Name")}
Phone: ${formData.get("Phone")}
Email: ${formData.get("Email")}

Property: ${formData.get("Property")}
Venue: ${formData.get("Event Space")}
Event Type: ${formData.get("Event Type")}

Guests: ${formData.get("Guests")}
Date: ${formData.get("Event Date")}

Message: ${formData.get("Message")}`;

  const encoded = encodeURIComponent(message);

  window.open(`https://wa.me/918306300609?text=${encoded}`, "_blank");
}

// EMAIL SUBMIT
document.getElementById("enquiryForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const form = this;

  fetch(form.action, {
    method: "POST",
    body: new FormData(form),
  })
  .then(() => {
    document.getElementById("successPopup").style.display = "flex";
    form.reset();

    document.getElementById("property").value = params.get("property") || "";
    document.getElementById("space").value = params.get("space") || "";
  })
  .catch(() => {
    alert("Something went wrong.");
  });
});

function closePopup(){
  document.getElementById("successPopup").style.display = "none";
}
</script>

</body>
</html>
