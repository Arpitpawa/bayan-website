<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Enquiry | Bayan</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>

/* BASE */
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #f8f5f0;
  color: #1a1a1a;
}

/* HERO */
.enquiry-hero {
  max-width: 1100px;
  margin: 120px auto 60px;
  padding: 0 20px;
  opacity: 0;
  transform: translateY(30px);
  animation: fadeUp 1s ease forwards;
}

.eyebrow {
  font-size: 12px;
  letter-spacing: 2px;
  color: #777;
}

.enquiry-hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: 48px;
  margin: 15px 0;
}

.enquiry-hero p {
  color: #666;
}

/* WRAPPER */
.enquiry-wrapper {
  display: flex;
  gap: 80px;
  max-width: 1100px;
  margin: auto;
  padding: 0 20px 100px;
}

/* LEFT */
.enquiry-left {
  flex: 2;
  opacity: 0;
  transform: translateY(30px);
  animation: fadeUp 1s ease forwards;
  animation-delay: 0.2s;
}

/* RIGHT */
.enquiry-right {
  flex: 1;
  padding-top: 20px;
  opacity: 0;
  transform: translateY(30px);
  animation: fadeUp 1s ease forwards;
  animation-delay: 0.4s;
}

.enquiry-right h3 {
  font-family: 'Playfair Display', serif;
  font-size: 26px;
}

.enquiry-right p {
  color: #666;
}

/* CONTACT */
.contact-block {
  margin-top: 25px;
}

.contact-block span {
  font-size: 12px;
  color: #888;
}

.contact-block a {
  display: block;
  text-decoration: none;
  color: #1a1a1a;
  margin-top: 5px;
}

/* FLOATING LABEL */
.form-group {
  position: relative;
  margin-bottom: 25px;
}

.form-group input,
.form-group textarea,
.form-group select {
  width: 100%;
  padding: 14px 0;
  border: none;
  border-bottom: 1px solid #ddd;
  background: transparent;
  outline: none;
}

.form-group label {
  position: absolute;
  left: 0;
  top: 14px;
  font-size: 14px;
  color: #888;
  transition: 0.3s;
  pointer-events: none;
}

/* FLOAT EFFECT */
.form-group input:focus + label,
.form-group input:not(:placeholder-shown) + label,
.form-group textarea:focus + label,
.form-group textarea:not(:placeholder-shown) + label,
.form-group select:focus + label {
  top: -10px;
  font-size: 11px;
  color: #b89b5e;
}

/* BUTTON */
.submit-btn {
  margin-top: 40px;
  padding: 14px 28px;
  border: 1px solid #1a1a1a;
  background: transparent;
  cursor: pointer;
  transition: 0.3s;
}

.submit-btn:hover {
  background: #1a1a1a;
  color: #fff;
}

/* POPUP */
.popup {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  background: #fff;
  padding: 30px 40px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.2);
  opacity: 0;
  transition: 0.3s;
  z-index: 1000;
  text-align: center;
}

.popup.active {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

/* ANIMATION */
@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* MOBILE */
@media (max-width: 768px) {
  .enquiry-wrapper {
    flex-direction: column;
  }

  .enquiry-hero h1 {
    font-size: 32px;
  }
}

</style>
</head>

<body>

<!-- HERO -->
<section class="enquiry-hero">
  <span class="eyebrow">BAYAN EVENTS</span>
  <h1>Plan your celebration with us</h1>
  <p>Share your details and our team will curate a refined experience.</p>
</section>

<!-- MAIN -->
<section class="enquiry-wrapper">

  <!-- FORM -->
  <div class="enquiry-left">

    <form id="enquiryForm">

      <div class="form-group">
        <input type="text" id="name" placeholder=" " required>
        <label>Full Name</label>
      </div>

      <div class="form-group">
        <input type="tel" id="phone" placeholder=" " required>
        <label>Phone Number</label>
      </div>

      <div class="form-group">
        <input type="email" id="email" placeholder=" ">
        <label>Email</label>
      </div>

      <div class="form-group">
        <input type="text" id="property" placeholder=" ">
        <label>Property</label>
      </div>

      <div class="form-group">
        <input type="text" id="space" placeholder=" ">
        <label>Event Space</label>
      </div>

      <div class="form-group">
        <textarea id="message" placeholder=" "></textarea>
        <label>Tell us more</label>
      </div>

      <button type="button" class="submit-btn" onclick="sendWhatsApp()">
        Send Enquiry →
      </button>

    </form>

  </div>

  <!-- DETAILS -->
  <div class="enquiry-right">

    <h3>Contact our team</h3>
    <p>We’ll assist you in planning your perfect event.</p>

    <div class="contact-block">
      <span>Email</span>
      <a href="mailto:crs@thebayanhotels.com">crs@thebayanhotels.com</a>
    </div>

    <div class="contact-block">
      <span>Phone</span>
      <a href="tel:+918306300609">+91 8306300609</a>
      <a href="tel:+918306300610">+91 8306300610</a>
    </div>

  </div>

</section>

<!-- POPUP -->
<div class="popup" id="popup">
  <h3>Opening WhatsApp...</h3>
  <p>Your enquiry is being prepared.</p>
</div>

<!-- JS -->
<script>

/* AUTO FILL */
const params = new URLSearchParams(window.location.search);
document.getElementById("property").value = params.get("property") || "";
document.getElementById("space").value = params.get("space") || "";

/* WHATSAPP */
function sendWhatsApp() {

  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const property = document.getElementById("property").value;
  const space = document.getElementById("space").value;
  const message = document.getElementById("message").value;

  if (!name || !phone) {
    alert("Please fill required fields");
    return;
  }

  // SHOW POPUP
  const popup = document.getElementById("popup");
  popup.classList.add("active");

  const text = `New Enquiry - Bayan

Name: ${name}
Phone: ${phone}
Property: ${property}
Space: ${space}

Message:
${message}`;

  const url = `https://wa.me/918306300609?text=${encodeURIComponent(text)}`;

  setTimeout(() => {
    window.open(url, "_blank");
    popup.classList.remove("active");
  }, 1500);
}

</script>

</body>
</html>
