<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gallery | Bayan Hotels</title>
<!-- Favicon -->
<link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon/favicon-16x16.png">
<link rel="shortcut icon" href="../assets/favicon/favicon.ico">
<link rel="manifest" href="../assets/favicon/site.webmanifest">

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap"
      rel="stylesheet"
    />
    
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <!-- Main CSS -->
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/header.css" />
    <link rel="stylesheet" href="assets/css/footer.css" />
    <link rel="stylesheet" href="assets/css/brand-skin.css" />
  <link rel="stylesheet" href="assets/css/gallery.css" />
</head>

<body>

<!-- =========================
   GALLERY SECTION
========================= -->
<section class="gallery-section">

  <div class="gallery-header">
    <span>Gallery</span>
    <h2>Moments across our properties</h2>
  </div>

  <!-- FILTER BUTTONS -->
  <div class="gallery-filters">
    <button class="active" data-filter="all">All</button>
    <button data-filter="jaibagh">Jaibagh</button>
    <button data-filter="kumbhabagh">Kumbhabagh</button>
    <button data-filter="sawai">Sawai Bagh</button>
    <button data-filter="amargarh">Amargarh</button>
    <button data-filter="udaibagh">Udaibagh</button>
    <button data-filter="wedding">Weddings</button>
  </div>

  <!-- GRID -->
  <div class="gallery-grid">

    <!-- ITEM -->
    <div class="gallery-item" data-category="kumbhabagh">
      <img src="https://images.unsplash.com/photo-1582719478250-c89cae4dc85b" />
      <div class="gallery-overlay">
        <span>KUMBHABAGH</span>
      </div>
    </div>

    <div class="gallery-item" data-category="jaibagh">
      <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945" />
      <div class="gallery-overlay">
        <span>JAIBAGH</span>
      </div>
    </div>

    <div class="gallery-item" data-category="udaibagh">
      <img src="https://images.unsplash.com/photo-1542314831-068cd1dbfeeb" />
      <div class="gallery-overlay">
        <span>UDAIBAGH</span>
      </div>
    </div>

    <div class="gallery-item" data-category="wedding">
      <img src="https://images.unsplash.com/photo-1519741497674-611481863552" />
      <div class="gallery-overlay">
        <span>WEDDINGS</span>
      </div>
    </div>

    <div class="gallery-item" data-category="amargarh">
      <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c" />
      <div class="gallery-overlay">
        <span>AMARGARH</span>
      </div>
    </div>

    <div class="gallery-item" data-category="sawai">
      <img src="https://images.unsplash.com/photo-1590490360182-c33d57733427" />
      <div class="gallery-overlay">
        <span>SAWAI BAGH</span>
      </div>
    </div>

  </div>

</section>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <span class="close">&times;</span>
  <img id="lightbox-img">
</div>

<script >// FILTER FUNCTION
const buttons = document.querySelectorAll(".gallery-filters button");
const items = document.querySelectorAll(".gallery-item");

buttons.forEach(btn => {
  btn.addEventListener("click", () => {

    // active class
    buttons.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    const filter = btn.getAttribute("data-filter");

    items.forEach(item => {
      if (filter === "all" || item.dataset.category === filter) {
        item.style.display = "block";
      } else {
        item.style.display = "none";
      }
    });

  });
});


// LIGHTBOX
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");

items.forEach(item => {
  item.addEventListener("click", () => {
    lightbox.style.display = "flex";
    lightboxImg.src = item.querySelector("img").src;
  });
});

document.querySelector(".close").onclick = () => {
  lightbox.style.display = "none";
};
</script>
</body>
</html>
